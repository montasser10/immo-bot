name: Immo Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immo-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktuellen Stand holen
        run: |
          git pull --rebase origin main

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIVATE_CHAT_ID: ${{ secrets.PRIVATE_CHAT_ID }}
          EMAIL_CHECK_ENABLED: ${{ secrets.EMAIL_CHECK_ENABLED }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INIT_MODE: "false"
        run: python immo_bot.py

      - name: Gesehene Anzeigen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add seen_ads.json today_deals.json || true
          if [ -f last_summary.txt ]; then git add last_summary.txt; fi

          if git diff --staged --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Update immo bot cache"

            git pull --rebase origin main
            git push origin main
          fi
